name: Publish signed installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          installer="Yonu-Music_${version}_x64-setup.exe"
          test -s "$installer"
          test -s "$installer.sig"
          export INSTALLER_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$installer"
          python3 -c 'import json,os; d=json.load(open("latest.json")); assert "v"+d["version"]==os.environ["GITHUB_REF_NAME"]; assert set(d["platforms"])=={"windows-x86_64"}; assert d["platforms"]["windows-x86_64"]["url"]==os.environ["INSTALLER_URL"]'
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo 'Release exists. Publish a new version instead.'
              exit 1
            fi
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          gh release create "$GITHUB_REF_NAME" "$installer" "$installer.sig" latest.json --verify-tag --latest --title "Yonu Music $version" --notes "Windows installer with signed in-app updates."
          curl --fail --location --retry 3 --output /dev/null "$INSTALLER_URL"
